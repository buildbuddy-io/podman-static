name: Build

on:
  push:
    # Publish `master` as Docker `latest` image.
    branches:
    - master
    - v5

    # Publish `v1.2.3` tags as releases.
    tags:
    - buildbuddy-v* # buildbuddy: use "buildbuddy-" prefix to avoid conflicts with upstream tags

  # Trigger the workflow on push or pull request on master branch
  pull_request:
    branches:
    - master
    - v5

  workflow_dispatch: # buildbuddy: allow manual runs (releases only when run on a buildbuddy-v* tag)

concurrency: # Run release builds sequentially, cancel outdated PR builds
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: # buildbuddy: read-only by default; only the release job gets contents: write
  contents: read

env:
  PODMAN_IMAGE: podman
  PODMAN_MINIMAL_IMAGE: podman-minimal
  PODMAN_REMOTE_IMAGE: podman-remote

jobs:
  push:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up qemu
      uses: docker/setup-qemu-action@v4
      with:
        platforms: all

    - name: Print environment
      run: |
        uname -a
        docker --version

    - name: Build & test
      run: make images test

    - name: Build multi-arch images and binaries
      if: "!startsWith(github.ref, 'refs/tags/buildbuddy-v')"
      run: make clean multiarch-tar

    - name: Build signed archives
      if: startsWith(github.ref, 'refs/tags/buildbuddy-v')
      run: make clean multiarch-tar TAR_TARGET=signed-tar
      env:
        GPG_SIGN_KEY: ${{ secrets.GPG_SIGN_KEY }}
        GPG_SIGN_KEY_PASSPHRASE: ${{ secrets.GPG_SIGN_KEY_PASSPHRASE }}

    # buildbuddy: upstream's registry login/push steps are removed; we only publish GitHub release archives.
    - name: Upload release archives
      if: startsWith(github.ref, 'refs/tags/buildbuddy-v')
      uses: actions/upload-artifact@v4
      with:
        name: release-archives
        path: build/asset/podman-linux-*.tar.gz*
        if-no-files-found: error

  # buildbuddy: create the GitHub release explicitly, only for buildbuddy-v* tags.
  release:
    needs: push
    if: startsWith(github.ref, 'refs/tags/buildbuddy-v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Download release archives
      uses: actions/download-artifact@v4
      with:
        name: release-archives
        path: asset

    - name: Create release
      run: |
        gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
          --title "${TAG#buildbuddy-}" --notes "" \
          asset/podman-linux-arm64.tar.gz.asc \
          asset/podman-linux-arm64.tar.gz \
          asset/podman-linux-amd64.tar.gz.asc \
          asset/podman-linux-amd64.tar.gz
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
